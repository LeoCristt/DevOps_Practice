name: ESLint

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
    types: [opened, reopened, synchronize]

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0' # Укажите версию Node.js, совместимую с вашим проектом

      - name: Install ESLint and plugins
        run: |
          npm install eslint@8.57.0
          npm install @microsoft/eslint-formatter-sarif@3.1.0
          npm install @eslint/js
          npm install typescript-eslint
          npm install eslint-plugin-prettier@5.2.1

      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: npx eslint backend --config backend/eslint-config.mjs --ext .js,.jsx,.ts,.tsx --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
        continue-on-error: false # Убрали continue-on-error, чтобы видеть ошибки

      - name: Check if SARIF file exists
        run: ls -la eslint-results.sarif || echo "File not found"

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
